name: C++ CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run CI script
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmd /c ci.bat
          else
            bash ./ci.sh
          fi

      - name: Upload hello artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-hello
          path: |
            build/hello
            build/Debug/hello.exe
          if-no-files-found: error
